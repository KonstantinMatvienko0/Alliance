<div class="wa-actions">
    <button type="button" class="wa-actions__toggle" aria-label="Действия"><i class="fa-solid fa-ellipsis"></i></button>
    <div class="wa-actions__menu">
        {% if task.status == 'open' or task.status == 'in_progress' %}
        <a href="{% url 'manager_tasks' %}?edit={{ task.pk }}{% if query_string %}&{{ query_string }}{% endif %}" class="wa-actions__item">
            <i class="fa-solid fa-pen"></i> Редактировать
        </a>
        {% endif %}
        {% if task.status == 'pending_review' %}
        <form action="{% url 'review_task' task.pk %}" method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="approve">
            <button type="submit" class="wa-actions__item mg-actions__item--success">Принять</button>
        </form>
        <form action="{% url 'review_task' task.pk %}" method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="reject">
            <button type="submit" class="wa-actions__item mg-actions__item--danger">Провал</button>
        </form>
        {% endif %}
        {% if task.status != 'completed' and task.status != 'failed' %}
        <form action="{% url 'delete_task' task.pk %}" method="post" onsubmit="return confirm('Удалить эту задачу?');">
            {% csrf_token %}
            <button type="submit" class="wa-actions__item mg-actions__item--danger">Удалить</button>
        </form>
        {% endif %}
    </div>
</div>
